<svg xmlns="http://www.w3.org/2000/svg" width="950" height="350" viewBox="0 0 950 350" role="img" aria-labelledby="title"><title id="title">От выделения до отдельного слоя</title><rect width="950" height="350" rx="18" fill="#f6f7f9"/><text x="28" y="36" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#303940">От выделения до отдельного слоя</text><rect x="28" y="60" width="274" height="240" rx="10" fill="white" stroke="#ccd8dc" stroke-width="2"/><text x="46" y="89" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#303940">1. Выделите лицо</text><rect x="338" y="60" width="274" height="240" rx="10" fill="white" stroke="#ccd8dc" stroke-width="2"/><text x="356" y="89" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#303940">2. Выберите дубль</text><rect x="648" y="60" width="274" height="240" rx="10" fill="white" stroke="#ccd8dc" stroke-width="2"/><text x="666" y="89" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#303940">3. Доработайте маску</text><path d="M52.0 210.0 Q52.0 172.6 85 172.6 Q118.0 172.6 118.0 210.0" fill="#b9d3d0"/><circle cx="85" cy="155" r="22" fill="#e4efee" stroke="#70aaa7" stroke-width="2"/><circle cx="77.74" cy="155" r="2.5" fill="#437d7a"/><circle cx="92.26" cy="155" r="2.5" fill="#437d7a"/><path d="M80.16 163.8 L89.84 163.8" fill="none" stroke="#437d7a" stroke-width="3"/><path d="M132.0 210.0 Q132.0 172.6 165 172.6 Q198.0 172.6 198.0 210.0" fill="#b9d3d0"/><circle cx="165" cy="155" r="22" fill="#e4efee" stroke="#70aaa7" stroke-width="2"/><circle cx="157.74" cy="155" r="2.5" fill="#437d7a"/><circle cx="172.26" cy="155" r="2.5" fill="#437d7a"/><path d="M160.16 163.8 L169.84 163.8" fill="none" stroke="#437d7a" stroke-width="3"/><path d="M212.0 210.0 Q212.0 172.6 245 172.6 Q278.0 172.6 278.0 210.0" fill="#b9d3d0"/><circle cx="245" cy="155" r="22" fill="#e4efee" stroke="#70aaa7" stroke-width="2"/><circle cx="237.74" cy="155" r="2.5" fill="#437d7a"/><circle cx="252.26" cy="155" r="2.5" fill="#437d7a"/><path d="M240.16 163.8 L249.84 163.8" fill="none" stroke="#437d7a" stroke-width="3"/><rect x="132" y="119" width="66" height="75" rx="10" fill="none" stroke="#638db9" stroke-width="2"/><text x="47" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#303940">На текущей фотографии</text><path d="M352.0 210.0 Q352.0 172.6 385 172.6 Q418.0 172.6 418.0 210.0" fill="#b9d3d0"/><circle cx="385" cy="155" r="22" fill="#e4efee" stroke="#70aaa7" stroke-width="2"/><circle cx="377.74" cy="155" r="2.5" fill="#437d7a"/><circle cx="392.26" cy="155" r="2.5" fill="#437d7a"/><path d="M380.16 163.8 L389.84 163.8" fill="none" stroke="#437d7a" stroke-width="3"/><path d="M442.0 210.0 Q442.0 172.6 475 172.6 Q508.0 172.6 508.0 210.0" fill="#b9d3d0"/><circle cx="475" cy="155" r="22" fill="#e4efee" stroke="#70aaa7" stroke-width="2"/><circle cx="467.74" cy="155" r="2.5" fill="#437d7a"/><circle cx="482.26" cy="155" r="2.5" fill="#437d7a"/><path d="M470.16 163.8 L479.84 163.8" fill="none" stroke="#437d7a" stroke-width="3"/><path d="M532.0 210.0 Q532.0 172.6 565 172.6 Q598.0 172.6 598.0 210.0" fill="#b9d3d0"/><circle cx="565" cy="155" r="22" fill="#e4efee" stroke="#70aaa7" stroke-width="2"/><circle cx="557.74" cy="155" r="2.5" fill="#437d7a"/><circle cx="572.26" cy="155" r="2.5" fill="#437d7a"/><path d="M560.16 163.8 L569.84 163.8" fill="none" stroke="#437d7a" stroke-width="3"/><rect x="438" y="115" width="74" height="112" rx="10" fill="none" stroke="#638db9" stroke-width="2"/><text x="356" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#303940">Среди найденных вариантов</text><path d="M676.0 223.0 Q676.0 175.4 718 175.4 Q760.0 175.4 760.0 223.0" fill="#b9d3d0"/><circle cx="718" cy="153" r="28" fill="#e4efee" stroke="#70aaa7" stroke-width="2"/><circle cx="708.76" cy="153" r="2.5" fill="#437d7a"/><circle cx="727.24" cy="153" r="2.5"