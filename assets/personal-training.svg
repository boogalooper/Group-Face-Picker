<svg xmlns="http://www.w3.org/2000/svg" width="950" height="350" viewBox="0 0 950 350" role="img" aria-labelledby="title"><title id="title">От ваших решений к личной модели</title><rect width="950" height="350" rx="18" fill="#f6f7f9"/><text x="28" y="36" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#303940">От ваших решений к личной модели</text><rect x="28" y="60" width="274" height="240" rx="10" fill="white" stroke="#ccd8dc" stroke-width="2"/><text x="42" y="90" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#303940">1. Сбор предпочтений</text><rect x="338" y="60" width="274" height="240" rx="10" fill="white" stroke="#ccd8dc" stroke-width="2"/><text x="352" y="90" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#303940">2. Объединение данных</text><rect x="648" y="60" width="274" height="240" rx="10" fill="white" stroke="#ccd8dc" stroke-width="2"/><text x="662" y="90" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#303940">3. Обучение</text><path d="M58.0 215.0 Q58.0 174.2 94 174.2 Q130.0 174.2 130.0 215.0" fill="#b9d3d0"/><circle cx="94" cy="155" r="24" fill="#e4efee" stroke="#70aaa7" stroke-width="2"/><circle cx="86.08" cy="155" r="2.5" fill="#437d7a"/><circle cx="101.92" cy="155" r="2.5" fill="#437d7a"/><path d="M88.72 164.6 L99.28 164.6" fill="none" stroke="#437d7a" stroke-width="3"/><path d="M201.0 215.0 Q201.0 174.2 237 174.2 Q273.0 174.2 273.0 215.0" fill="#b9d3d0"/><circle cx="237" cy="155" r="24" fill="#e4efee" stroke="#70aaa7" stroke-width="2"/><circle cx="229.08" cy="155" r="2.5" fill="#437d7a"/><circle cx="244.92" cy="155" r="2.5" fill="#437d7a"/><path d="M231.72 164.6 L242.28 164.6" fill="none" stroke="#437d7a" stroke-width="3"/><text x="147" y="172" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#437d7a">&gt;</text><text x="44" y="253" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#303940">Выбранный лучше текущего</text><text x="44" y="278" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#303940">После успешной вставки</text><rect x="363" y="119" width="223" height="37" rx="10" fill="#e4efee" stroke="#ccd8dc" stroke-width="2"/><text x="376" y="143" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#303940">training_data / PC_A</text><rect x="363" y="170" width="223" height="37" rx="10" fill="#e4efee" stroke="#ccd8dc" stroke-width="2"/><text x="376" y="194" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#303940">training_data / PC_B</text><text x="354" y="253" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#303940">Папки компьютеров целиком</text><text x="354" y="278" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#303940">На одном компьютере</text><rect x="682" y="125" width="206" height="78" rx="10" fill="#e4efee" stroke="#ccd8dc" stroke-width="2"/><text x="702" y="158" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#303940">Личная модель</text><text x="701" y="184" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#303940">Ваши предпочтения</text><text x="664" y="253" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#303940">Запустите обучение и выберите</text><text x="664" y="278" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#303940">модель в настройках</text><text x="28" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#303940">Сбор включается отдельно. Отмена и неудачная вставка не добавляют обучающие пары.</text></svg>